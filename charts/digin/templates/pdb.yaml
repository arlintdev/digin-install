{{- if .Values.podDisruptionBudget.enabled }}
{{- $pdb := .Values.podDisruptionBudget }}
{{- $min := ternary "" (toString $pdb.minAvailable) (kindIs "invalid" $pdb.minAvailable) }}
{{- $max := ternary "" (toString $pdb.maxUnavailable) (kindIs "invalid" $pdb.maxUnavailable) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "digin.fullname" . }}
  labels:
    {{- include "digin.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  {{- if ne $min "" }}
  minAvailable: {{ $pdb.minAvailable }}
  {{- else if ne $max "" }}
  maxUnavailable: {{ $pdb.maxUnavailable }}
  {{- else if gt (int .Values.replicaCount) 1 }}
  # Several servers: a voluntary disruption (a node drain) never takes the last one.
  minAvailable: 1
  {{- else }}
  # One server: a node drain may move it, which a budget of none would block for ever.
  maxUnavailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "digin.selectorLabels" (dict "ctx" . "component" "server") | nindent 6 }}
{{- end }}
