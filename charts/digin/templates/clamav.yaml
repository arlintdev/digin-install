{{- if .Values.clamav.enabled }}
{{- $name := include "digin.clamavName" . }}
{{- $c := .Values.clamav }}
# ClamAV's daemon, which Digin shows every upload before keeping it (DIGIN_SCAN=clamd://...:3310).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "digin.labels" . | nindent 4 }}
    app.kubernetes.io/component: clamav
data:
  # Starts freshclam and clamd itself, retries a clamd that refused to start, and stops the container
  # if clamd stops after it has answered (Digin's deploy/clamav/digin-clamav-start).
  digin-clamav-start: |
{{ .Files.Get "files/digin-clamav-start" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "digin.labels" . | nindent 4 }}
    app.kubernetes.io/component: clamav
spec:
  type: ClusterIP
  ports:
    - name: clamd
      port: 3310
      targetPort: clamd
      protocol: TCP
  selector:
    {{- include "digin.selectorLabels" (dict "ctx" . "component" "clamav") | nindent 4 }}
---
{{- if $c.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    {{- include "digin.labels" . | nindent 4 }}
    app.kubernetes.io/component: clamav
spec:
  accessModes:
    - ReadWriteOnce
  {{- with $c.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $c.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "digin.labels" . | nindent 4 }}
    app.kubernetes.io/component: clamav
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "digin.selectorLabels" (dict "ctx" . "component" "clamav") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "digin.labels" . | nindent 8 }}
        app.kubernetes.io/component: clamav
      annotations:
        checksum/start: {{ .Files.Get "files/digin-clamav-start" | sha256sum }}
    spec:
      serviceAccountName: {{ include "digin.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clamav
          image: {{ printf "%s:%s" $c.image.repository $c.image.tag }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          command: ["/sbin/tini", "--", "/bin/sh", "/usr/local/bin/digin-clamav-start"]
          env:
            {{- with $c.privateMirror }}
            - name: FRESHCLAM_CONF_PrivateMirror
              value: {{ . | quote }}
            {{- end }}
            - name: FRESHCLAM_CHECKS
              value: "24"
            # Each database only with its SHA-256 .cvd.sign file (ClamAV's own check).
            - name: FRESHCLAM_CONF_FIPSCryptoHashLimits
              value: "yes"
            - name: CLAMD_CONF_FIPSCryptoHashLimits
              value: "yes"
            - name: CLAMD_STARTUP_TIMEOUT
              value: {{ $c.startupTimeoutSeconds | quote }}
            # A file Digin takes is one clamd scans.
            - name: CLAMD_CONF_StreamMaxLength
              value: {{ printf "%dM" (max 100 (int .Values.config.maxUploadMB)) | quote }}
          ports:
            - name: clamd
              containerPort: 3310
              protocol: TCP
          # Root only long enough to take its directories and step down to the clamav user.
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETGID
                - SETUID
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            exec:
              command: ["clamdscan", "--ping", "1"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: {{ add (div (int $c.startupTimeoutSeconds) 10) 6 }}
          readinessProbe:
            exec:
              command: ["clamdscan", "--ping", "1"]
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["clamdscan", "--ping", "1"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            - name: signatures
              mountPath: /var/lib/clamav
            - name: start
              mountPath: /usr/local/bin/digin-clamav-start
              subPath: digin-clamav-start
              readOnly: true
      volumes:
        - name: signatures
          {{- if $c.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $name }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: start
          configMap:
            name: {{ $name }}
            defaultMode: 0444
      {{- with $c.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
