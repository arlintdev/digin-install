{{- if .Values.postgresql.enabled }}
{{- $name := include "digin.postgresqlName" . }}
{{- $pg := .Values.postgresql }}
# PostgreSQL 17 for Digin alone: the owner (database.ownerUser) is its superuser, used only by the migrate
# step; the app signs in as its own logins. Reached by its bare service name, on the cluster network, and by
# nothing but Digin's pods (networkpolicy.yaml).
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "digin.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
  selector:
    {{- include "digin.selectorLabels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-hl
  labels:
    {{- include "digin.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
  selector:
    {{- include "digin.selectorLabels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "digin.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ $name }}-hl
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "digin.selectorLabels" (dict "ctx" . "component" "postgresql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "digin.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
    spec:
      serviceAccountName: {{ include "digin.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The image's own postgres user (70), from the start: no root, no step down, no capability.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgresql
          image: {{ printf "%s:%s" $pg.image.repository $pg.image.tag }}
          imagePullPolicy: {{ $pg.image.pullPolicy }}
          args:
            - postgres
            - -c
            - password_encryption=scram-sha-256
            - -c
            - shared_buffers={{ $pg.sharedBuffers }}
            - -c
            {{- /* Each server opens up to 16 connections for people's requests, 16 for its own work and one to listen to
            the others; with several, the pod a rolling update adds counts too. */}}
            - max_connections={{ ternary (max (int $pg.maxConnections) (add 10 (mul 35 (add (int .Values.replicaCount) 1)))) $pg.maxConnections (gt (int .Values.replicaCount) 1) }}
            - -c
            - log_connections=on
            - -c
            - log_disconnections=on
            - -c
            - wal_level=replica
          env:
            - name: POSTGRES_USER
              value: {{ .Values.database.ownerUser | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            # Read at first start only, to make the owner.
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/db-owner-password
            # The C collation, so text sorts as Digin expects, and SCRAM, never MD5.
            - name: POSTGRES_INITDB_ARGS
              value: --locale=C --encoding=UTF8 --auth-host=scram-sha-256
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: TZ
              value: UTC
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -q']
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -q']
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -q']
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
            - name: owner-password
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: owner-password
          secret:
            secretName: {{ include "digin.secretName" . }}
            defaultMode: 0440
            items:
              - key: db-owner-password
                path: db-owner-password
      {{- with $pg.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "digin.selectorLabels" (dict "ctx" . "component" "postgresql") | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml $pg.persistence.accessModes | nindent 10 }}
        {{- with $pg.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.persistence.size }}
{{- end }}
