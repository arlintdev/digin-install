{{- include "digin.validate" . }}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "digin.secretName" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $oldData := get $old "data" | default dict }}
{{- /* A value given in values wins; else the one already in the cluster; else a new random one. */}}
{{- $filesKey := .Values.secrets.filesKey | b64enc }}
{{- if not .Values.secrets.filesKey }}{{ $filesKey = get $oldData "files-key" | default (randBytes 32 | b64enc) }}{{ end }}
{{- $owner := .Values.secrets.dbOwnerPassword | b64enc }}
{{- if not .Values.secrets.dbOwnerPassword }}{{ $owner = get $oldData "db-owner-password" | default (randAlphaNum 40 | b64enc) }}{{ end }}
{{- $server := .Values.secrets.dbServerPassword | b64enc }}
{{- if not .Values.secrets.dbServerPassword }}{{ $server = get $oldData "db-server-password" | default (randAlphaNum 40 | b64enc) }}{{ end }}
{{- $system := .Values.secrets.dbSystemPassword | b64enc }}
{{- if not .Values.secrets.dbSystemPassword }}{{ $system = get $oldData "db-system-password" | default (randAlphaNum 40 | b64enc) }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "digin.labels" . | nindent 4 }}
  annotations:
    # The files key seals every upload: losing it loses them. Kept when the release is uninstalled.
    helm.sh/resource-policy: keep
type: Opaque
data:
  files-key: {{ $filesKey }}
  db-owner-password: {{ $owner }}
  db-server-password: {{ $server }}
  db-system-password: {{ $system }}
  {{- if .Values.signIn.oidc.clientSecret }}
  oidc-client-secret: {{ .Values.signIn.oidc.clientSecret | b64enc }}
  {{- else if hasKey $oldData "oidc-client-secret" }}
  oidc-client-secret: {{ get $oldData "oidc-client-secret" }}
  {{- end }}
  {{- if .Values.signIn.google.clientSecret }}
  google-client-secret: {{ .Values.signIn.google.clientSecret | b64enc }}
  {{- else if hasKey $oldData "google-client-secret" }}
  google-client-secret: {{ get $oldData "google-client-secret" }}
  {{- end }}
  {{- range .Values.secretFiles }}
  {{- if .value }}
  {{ .key }}: {{ .value | b64enc }}
  {{- else if hasKey $oldData .key }}
  {{ .key }}: {{ get $oldData .key }}
  {{- end }}
  {{- end }}
{{- end }}
