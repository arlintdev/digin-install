apiVersion: v1
kind: Service
metadata:
  name: {{ include "digin.fullname" . }}
  labels:
    {{- include "digin.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: {{ ternary "https" "http" .Values.appTLS.enabled }}
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      {{- if .Values.appTLS.enabled }}
      appProtocol: https
      {{- end }}
  selector:
    {{- include "digin.selectorLabels" (dict "ctx" . "component" "server") | nindent 4 }}
