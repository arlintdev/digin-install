# An Ingress with cert-manager, secrets from a Secret you made, the FIPS image, ClamAV and nightly dumps.
publicUrl: https://digin.example.gov
signIn:
  oidc:
    issuer: https://login.example.gov/realms/work
    clientId: digin
  requireVerifiedEmail: true
secrets:
  existingSecret: digin-secrets
image:
  fips: true
config:
  trustedProxies: 10.42.0.0/16
  iceServers: "[]"
  botsAllowedHosts: none
  sessionMax: 12h
  sessionIdle: 30m
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: 25m
  tls:
    enabled: true
    secretName: digin-tls
networkPolicy:
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
clamav:
  enabled: true
  persistence:
    enabled: true
backup:
  enabled: true
secretFiles:
  - env: DIGIN_ALERT_WEBHOOK_SECRET_FILE
    key: alert-webhook-secret
env:
  DIGIN_ACCOUNT_IDLE_DAYS: 90
