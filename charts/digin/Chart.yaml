apiVersion: v2
name: digin
description: >-
  Digin, a self-hosted work app (issues, pages, chat, calls) for government boundaries.
  Proprietary: free to evaluate for 90 days, then a license key from arlint.dev is required.
type: application
# The chart's own version, moved with every change to the chart.
version: 0.43.1
