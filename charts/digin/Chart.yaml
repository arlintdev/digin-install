home: https://about.digin.work
sources:
  - https://github.com/arlintdev/digin-install
keywords:
  - digin
  - issues
  - wiki
  - chat
  - fisma
  - il4
maintainers:
  - name: arlint.dev
    email: sales@digin.work
annotations:
  licenses: Proprietary (90-day evaluation; see LICENSE)
